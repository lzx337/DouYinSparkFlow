name: Schedule Spark Flow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

concurrency:
  group: schedule-dev
  cancel-in-progress: true

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run task
        env:
          BROWSER_TIMEOUT: '${{ vars.BROWSER_TIMEOUT }}'
          FRIEND_LIST_WAIT_TIME: '${{ vars.FRIEND_LIST_WAIT_TIME }}'
          HITOKOTO_TYPES: '${{ vars.HITOKOTO_TYPES }}'
          LOG_LEVEL: '${{ vars.LOG_LEVEL }}'
          MATCH_MODE: '${{ vars.MATCH_MODE }}'
          MESSAGE_TEMPLATE: '${{ vars.MESSAGE_TEMPLATE }}'
          TASKS: '${{ vars.TASKS }}'
          TASK_RETRY_TIMES: '${{ vars.TASK_RETRY_TIMES }}'
          PROXY_ADDRESS: '${{ vars.PROXY_ADDRESS }}'
          COOKIES_DYQIJ1ANHNPE: '${{ secrets.COOKIES_DYQIJ1ANHNPE }}'
        run: python main.py

      - name: Upload debug logs
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/
          if-no-files-found: ignore
