name: Schedule Spark Flow

on:
  workflow_dispatch:
  schedule:
    - cron: '7 16 * * *'

# 最小权限：本工作流不需要写仓库
permissions:
  contents: read

# 同一时间只跑一个实例，避免重复发送
concurrency:
  group: douyin-spark-flow-dev
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # 只显式注入白名单变量：任务清单来自 vars，各账号 Cookie 来自 secrets。
      # 不再把全部 vars/secrets 导出成 JSON/.env 后全量注入（避免无谓泄露面）。
      - name: Run task
        env:
          TASKS: ${{ vars.TASKS }}
          COOKIES_DYQIJ1ANHNPE: ${{ secrets.COOKIES_DYQIJ1ANHNPE }}
          COOKIES_AONANANIDEGU: ${{ secrets.COOKIES_AONANANIDEGU }}
          # 发送确认/表头确认的选择器（vars，需在真实登录页核实后配置；缺省则对应功能关闭）
          OUTGOING_BUBBLE_SELECTOR: ${{ vars.OUTGOING_BUBBLE_SELECTOR }}
          FAILED_BUBBLE_SELECTOR: ${{ vars.FAILED_BUBBLE_SELECTOR }}
          CHAT_HEADER_TITLE_SELECTOR: ${{ vars.CHAT_HEADER_TITLE_SELECTOR }}
          # 只读诊断模式：搜索/点击/表头校验执行但发送前停止（DRY_RUN=1 时绝不误发）
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python main.py

      # 只失败时上传：脱敏文本日志（.txt） + 截图（.png），不含完整 HTML / .env / Cookie
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            logs/**/*.txt
            logs/**/*.png
          if-no-files-found: ignore
